[workspace]
resolver = "3"
members = [
    "crates/symeraseme-core",
]

[workspace.package]
version = "0.14.1"
edition = "2024"
rust-version = "1.98"
authors = ["Daniel Justus"]
description = "Privacy-first data broker removal automation"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-eraseme"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.11.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
